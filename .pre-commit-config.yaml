repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.3
  hooks:
    - id: ruff-check
      args: [ --fix ]
      files: \.py$
    - id: ruff-format
      files: \.py$

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
    # Exclude elisp files to not clear page breaks
    exclude: \.el$
  - id: check-json
    exclude: (devcontainer\.json|launch\.json|settings\.json)$
  - id: check-toml
  - id: check-yaml

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.0.0
  hooks:
    - id: mypy
      stages: [pre-push, manual]
      pass_filenames: false
      args:
      - --config-file=pyproject.toml

- repo: https://github.com/codespell-project/codespell
  # Configuration for codespell is in pyproject.toml
  rev: v2.4.2
  hooks:
  - id: codespell
    # Mirror central skip patterns: pre-commit passes files explicitly,
    # which bypasses codespell's own skip handling.
    exclude: '^(tests/data/|src/khoj/database/migrations/)'
    additional_dependencies:
    - tomli; python_version<'3.11'
